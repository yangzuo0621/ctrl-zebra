name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run-integration: true
            run-coverage: true
          - os: macos-latest
            run-integration: false
            run-coverage: false
          - os: windows-latest
            run-integration: false
            run-coverage: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate dependency update policy
        run: pnpm test:dependabot

      - name: Architecture hard gates and advisory report
        run: pnpm check:architecture

      - name: Architecture fixture tests
        run: pnpm test:architecture

      - name: Check formatting and lint
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Extension integration tests (Ubuntu)
        if: ${{ matrix.run-integration }}
        run: xvfb-run -a pnpm test:integration

      - name: Coverage gate (Ubuntu)
        if: ${{ matrix.run-coverage }}
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Performance baseline benchmark (Ubuntu)
        if: ${{ matrix.run-integration }}
        run: xvfb-run -a pnpm benchmark:performance -- --runs 3 --warmups 1
