name: Marketplace Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Installed VSIX smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CTRL_ZEBRA_MARKETPLACE_SMOKE: "1"
      SOURCE_DATE_EPOCH: "0"
      CTRL_ZEBRA_SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Marketplace metadata and assets
        run: pnpm test:marketplace

      - name: Build and verify exact VSIX
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            xvfb-run -a pnpm package:vsix
          else
            pnpm package:vsix
          fi

      - name: Locate exact VSIX
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          vsix_files=()
          while IFS= read -r file; do
            vsix_files+=("${file}")
          done < <(find .artifacts -maxdepth 1 -type f -name '*.vsix' -print)
          if [[ ${#vsix_files[@]} -ne 1 ]]; then
            echo "Expected exactly one VSIX, found ${#vsix_files[@]}." >&2
            exit 1
          fi
          printf 'path=%s\n' "${vsix_files[0]}" >> "${GITHUB_OUTPUT}"

      - name: Install and smoke exact VSIX
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            xvfb-run -a pnpm smoke:vsix "${{ steps.artifact.outputs.path }}"
          else
            pnpm smoke:vsix "${{ steps.artifact.outputs.path }}"
          fi

      - name: Record bounded smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/marketplace-smoke
          node -e "const fs=require('node:fs'); const path=require('node:path'); const value={schemaVersion:1,task:'T2207',sourceCommit:process.env.CTRL_ZEBRA_SOURCE_SHA,runnerOs:process.env.RUNNER_OS,marketplaceMetadata:'passed',deterministicProviderTools:'passed',deletionAndDiagnosticsContracts:'passed',installedVsixSmoke:'passed',containsPrivateState:false}; fs.writeFileSync(path.join('.artifacts','marketplace-smoke',process.env.RUNNER_OS+'.json'),JSON.stringify(value,null,2)+'\n');"

      - name: Upload smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ctrl-zebra-marketplace-smoke-${{ runner.os }}-${{ env.CTRL_ZEBRA_SOURCE_SHA }}
          path: .artifacts/marketplace-smoke/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Write smoke summary
        shell: bash
        run: |
          {
            echo "## T2207 Marketplace smoke"
            echo
            echo "Runner: \`${RUNNER_OS}\`"
            echo
            echo "Source commit: \`${CTRL_ZEBRA_SOURCE_SHA}\`"
            echo
            echo "Marketplace metadata, deterministic Provider/Tool multi-turn integration, deletion/diagnostics controller contracts, exact VSIX installation, activation, Provider configuration, MCP restriction, lifecycle commands, and structured logging passed."
            echo
            echo "Marketplace publication was not attempted."
          } >> "${GITHUB_STEP_SUMMARY}"
