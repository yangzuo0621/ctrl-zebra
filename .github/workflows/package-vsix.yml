name: Package VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: package-vsix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build verified VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata and dependency declarations
        run: pnpm release:verify

      - name: Build and verify VSIX
        run: xvfb-run -a pnpm package:vsix

      - name: Record VSIX checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t vsix_files < <(find .artifacts -maxdepth 1 -type f -name '*.vsix' -print)
          if [[ ${#vsix_files[@]} -ne 1 ]]; then
            echo "Expected exactly one VSIX, found ${#vsix_files[@]}." >&2
            exit 1
          fi
          pnpm release:verify -- --artifact "${vsix_files[0]}" --output .artifacts/release
          (
            cd .artifacts
            sha256sum -- *.vsix > SHA256SUMS
          )
          cat .artifacts/SHA256SUMS

      - name: Upload verified VSIX
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ctrl-zebra-vsix-${{ github.sha }}
          path: |
            .artifacts/*.vsix
            .artifacts/SHA256SUMS
            .artifacts/release/third-party-dependencies.json
            .artifacts/release/sbom.spdx.json
            .artifacts/release/vsix-provenance.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0

      - name: Write build summary
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Verified VSIX"
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            echo "Artifact archive SHA-256: \`${ARTIFACT_DIGEST}\`"
            echo
            echo "[Download artifact](${ARTIFACT_URL})"
            echo
            echo '```text'
            cat .artifacts/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
