name: Reproducible Release Verification

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Enter the protected release environment after verification (does not publish by default)."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify reproducible release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata and dependency declarations
        run: pnpm release:verify

      - name: Build reproducible VSIX
        run: xvfb-run -a pnpm package:vsix

      - name: Audit exact VSIX and write release evidence
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t vsix_files < <(find .artifacts -maxdepth 1 -type f -name '*.vsix' -print)
          if [[ ${#vsix_files[@]} -ne 1 ]]; then
            echo "Expected exactly one VSIX, found ${#vsix_files[@]}." >&2
            exit 1
          fi
          pnpm release:verify -- --artifact "${vsix_files[0]}" --output .artifacts/release
          printf 'path=%s\n' "${vsix_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Record VSIX checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -- "${{ steps.audit.outputs.path }}" > .artifacts/SHA256SUMS
          cat .artifacts/SHA256SUMS

      - name: Upload verified release evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ctrl-zebra-release-${{ github.sha }}
          path: |
            .artifacts/*.vsix
            .artifacts/SHA256SUMS
            .artifacts/release/third-party-dependencies.json
            .artifacts/release/sbom.spdx.json
            .artifacts/release/vsix-provenance.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0

      - name: Write release summary
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Reproducible release verification"
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            echo "Artifact archive SHA-256: \`${ARTIFACT_DIGEST}\`"
            echo
            echo "[Download retained evidence](${ARTIFACT_URL})"
            echo
            echo '```text'
            cat .artifacts/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  protected-publish-gate:
    name: Protected publication confirmation
    needs: verify
    if: ${{ inputs.publish && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: release
    permissions:
      contents: read

    steps:
      - name: Require a CI secret-store credential
        env:
          RELEASE_ENVIRONMENT: release
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "${VSCE_PAT}" ]]; then
            echo "VSCE_PAT is not configured in the protected release environment." >&2
            exit 1
          fi
          echo "Protected publication confirmation received; Marketplace publication remains a separate manual operation."
